# SPDX-License-Identifier: Apache-2.0
#
# canopen-zephyr - CANopenNode (v4) Zephyr 模块 + 应用仓库
#
# 本仓库自身是 Zephyr module (zephyr/module.yml 声明) + Zephyr application
# (含 samples/). CANopenNode v4 通过 git submodule 内嵌 (CANopenNode/).
#
# 使用:
#   west init -l canopen-zephyr        # 用本仓库 manifest 初始化 workspace
#   west update                        # 拉取 zephyr + submodule
#   west build -b native_sim samples/canopen

manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: main
      clone-depth: 1
      import:
        # 仅引入 zephyr 必需的几个 module, 避免拉一大堆
        name-allowlist:
          - cmsis
          - hal_stm32
          - mbedtls
  self:
    path: canopen-zephyr
