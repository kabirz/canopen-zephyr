#
# CANopen (v4) sample 配置 - 完整功能.
#
# CAN 配置:
#   - 通过 devicetree chosen(zephyr_canbus) 选定 CAN 设备
#   - 板级 overlay 提供 chosen 节点 + bitrate
#
# native_sim 快速验证 (Linux, 需 vcan):
#   sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set vcan0 up
#   west build -b native_sim -d build/native samples/canopen \
#       -DDTC_OVERLAY_FILE=boards/native_sim.overlay
#   ./build/native/zephyr/zephyr.exe

# ===== CANopenNode v4 module =====
CONFIG_CANOPENNODE=y
CONFIG_CANOPEN_NODE_ID=10
CONFIG_CANOPENNODE_LOG_LEVEL_INF=y

# ===== 完整功能模块 =====
# CiA 305 LSS (节点 ID/波特率在线配置)
CONFIG_CANOPENNODE_LSS=y
# SDO 客户端 (master 功能)
CONFIG_CANOPENNODE_SDO_CLIENT=y
# CiA 309-3 ASCII 网关
CONFIG_CANOPENNODE_GATEWAY_ASCII=n
# OD 持久化 (Zephyr settings)
CONFIG_CANOPENNODE_STORAGE=y
# LED 指示 (CiA 303-3)
CONFIG_CANOPENNODE_LEDS=y
# SYNC 线程
CONFIG_CANOPENNODE_SYNC_THREAD=y

# ===== CAN =====
CONFIG_CAN=y
CONFIG_CAN_DEFAULT_BITRATE=250000

# ===== 日志 =====
CONFIG_LOG=y
CONFIG_PRINTK=y

# ===== 运行时设置 (storage 需要) =====
CONFIG_SETTINGS=y
